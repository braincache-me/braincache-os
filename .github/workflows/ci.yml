name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  workflow-studio:
    name: Workflow Studio tests (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Run tests
        working-directory: braincache_server
        run: npm test

  macos-app:
    name: macOS app build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ClipVault
        run: xcodegen generate
      - name: Build
        working-directory: ClipVault
        run: xcodebuild build -scheme ClipVault -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO
